version: '3.8'

services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hotel-booking-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
    networks:
      - hotel-network-dev
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  hotel-network-dev:
    driver: bridge

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-booking-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - hotel-network
    restart: unless-stopped

  # Descomenta esta sección cuando tengas el backend configurado

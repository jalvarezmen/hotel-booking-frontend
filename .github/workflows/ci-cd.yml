name: 🚀 CI/CD Pipeline

on:
  push:
    branches:
      - '**'  # Todas las ramas
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality-check:
    name: 🎯 Control de Calidad
    runs-on: ubuntu-latest
    
    # Determinar si es PR a main/develop (validaciones bloqueantes)
    # o push a otras ramas (validaciones informativas)
    strategy:
      fail-fast: false
    
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        id: install-deps
        run: |
          echo "📦 Instalando dependencias..."
          echo "🔧 Verificando package-lock.json..."
          
          # Verificar si package-lock.json existe
          if [ ! -f "package-lock.json" ]; then
            echo "⚠️ package-lock.json no encontrado, generando uno nuevo..."
            npm install
            echo "✅ Dependencias instaladas y package-lock.json generado"
            exit 0
          fi
          
          echo "✅ package-lock.json encontrado"
          
          # Intentar npm ci primero (más rápido y determinístico)
          echo "🔄 Intentando npm ci..."
          if npm ci 2>&1; then
            echo "✅ Dependencias instaladas exitosamente con npm ci"
            exit 0
          fi
          
          # Si npm ci falla, intentar con --legacy-peer-deps
          echo "⚠️ npm ci falló, intentando con --legacy-peer-deps..."
          if npm ci --legacy-peer-deps 2>&1; then
            echo "✅ Dependencias instaladas con npm ci --legacy-peer-deps"
            exit 0
          fi
          
          # Si aún falla, usar npm install (regenerará el lock file)
          echo "⚠️ npm ci falló completamente, el package-lock.json está desincronizado"
          echo "🔄 Regenerando package-lock.json con npm install..."
          npm install
          echo "✅ Dependencias instaladas con npm install"
          echo "⚠️ NOTA: El package-lock.json fue regenerado. Considera hacer commit del nuevo archivo."
      
      - name: 🔍 Paso 1: ESLint - Verificar código
        id: lint
        run: |
          echo "🔍 Ejecutando análisis de código con ESLint..."
          npm run lint
        continue-on-error: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      
      - name: 🔷 Paso 2: TypeScript - Verificar tipos
        id: typescript
        run: |
          echo "🔷 Verificando tipos de TypeScript..."
          npx tsc --noEmit
        continue-on-error: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      
      - name: 🏗️ Paso 3: Build - Compilar proyecto
        id: build
        run: |
          echo "🏗️ Compilando el proyecto..."
          npm run build
        continue-on-error: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      
      - name: 📦 Subir artefactos de build
        uses: actions/upload-artifact@v4
        if: success() && steps.build.outcome == 'success'
        with:
          name: dist-build-${{ github.sha }}
          path: dist/
          retention-days: 7
      
      - name: 📊 Generar resumen de resultados
        if: always()
        run: |
          echo "## 📊 Resumen de Validación" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determinar el contexto
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "### 🔍 Validación de Pull Request" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Rama objetivo:** \`${{ github.base_ref }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Rama origen:** \`${{ github.head_ref }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **Todas las validaciones deben pasar para poder mergear**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Validación de Push" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Rama:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/develop" ]; then
              echo "⚠️ **Todas las validaciones deben pasar**" >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ **Validaciones informativas (no bloqueantes)**" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resultados:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Validación | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Verificar estado de cada paso
          if [ "${{ steps.install-deps.outcome }}" == "success" ]; then
            echo "| 📦 Instalación de dependencias | ✅ Pasó |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📦 Instalación de dependencias | ❌ Falló |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.lint.outcome }}" == "success" ]; then
            echo "| 🔍 ESLint | ✅ Pasó |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.lint.outcome }}" == "failure" ]; then
            echo "| 🔍 ESLint | ❌ Falló |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔍 ESLint | ⚠️ Con errores (no bloqueante) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.typescript.outcome }}" == "success" ]; then
            echo "| 🔷 TypeScript | ✅ Pasó |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.typescript.outcome }}" == "failure" ]; then
            echo "| 🔷 TypeScript | ❌ Falló |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔷 TypeScript | ⚠️ Con errores (no bloqueante) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "| 🏗️ Build | ✅ Pasó |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.build.outcome }}" == "failure" ]; then
            echo "| 🏗️ Build | ❌ Falló |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🏗️ Build | ⚠️ Con errores (no bloqueante) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Determinar si el job pasó o falló
          if [ "${{ steps.lint.outcome }}" == "success" ] && \
             [ "${{ steps.typescript.outcome }}" == "success" ] && \
             [ "${{ steps.build.outcome }}" == "success" ] && \
             [ "${{ steps.install-deps.outcome }}" == "success" ]; then
            echo "### ✅ Todas las validaciones pasaron exitosamente" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🎉 El PR está listo para ser revisado y mergeado." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ❌ Algunas validaciones fallaron" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "${{ github.event_name }}" == "pull_request" ] || \
               [ "${{ github.ref }}" == "refs/heads/main" ] || \
               [ "${{ github.ref }}" == "refs/heads/develop" ]; then
              echo "⚠️ **El PR/Push está bloqueado hasta corregir los errores.**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Por favor, revisa los logs de los pasos que fallaron y corrige los errores." >> $GITHUB_STEP_SUMMARY
            else
              echo "ℹ️ Estas son validaciones informativas. Puedes continuar trabajando mientras corriges las advertencias." >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: ❌ Fallar si es PR a main/develop y hay errores
        if: |
          (github.event_name == 'pull_request' && 
           (github.base_ref == 'main' || github.base_ref == 'develop')) &&
          (steps.lint.outcome != 'success' || 
           steps.typescript.outcome != 'success' || 
           steps.build.outcome != 'success' ||
           steps.install-deps.outcome != 'success')
        run: |
          echo "❌ Validaciones bloqueantes fallaron para PR a ${{ github.base_ref }}"
          exit 1


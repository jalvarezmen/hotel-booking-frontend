name: 🚀 Validación en Push

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  validate-push:
    name: ✅ Validar Push
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4
      
      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Instalar dependencias
        run: |
          echo "📦 Instalando dependencias..."
          npm ci
      
      - name: 🔍 Ejecutar ESLint
        continue-on-error: true
        run: |
          echo "🔍 Verificando calidad de código con ESLint..."
          npm run lint || echo "⚠️ Advertencias de lint encontradas (no bloqueante)"
      
      - name: 🔷 Verificar tipos de TypeScript
        continue-on-error: true
        run: |
          echo "🔷 Verificando tipos de TypeScript..."
          npx tsc --noEmit || echo "⚠️ Errores de tipos encontrados (no bloqueante)"
      
      - name: 🏗️ Verificar build
        continue-on-error: true
        run: |
          echo "🏗️ Verificando que el proyecto compile correctamente..."
          npm run build || echo "⚠️ Errores de build encontrados (no bloqueante)"
      
      - name: 📊 Resumen de validación
        if: always()
        run: |
          echo "## 📊 Resumen de Validación" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Validaciones completadas (no bloqueantes para ramas de desarrollo)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Nota:" >> $GITHUB_STEP_SUMMARY
          echo "Las validaciones en ramas de desarrollo son informativas y no bloquean el push." >> $GITHUB_STEP_SUMMARY
          echo "Para mergear a main o develop, se requiere que el PR pase todas las validaciones." >> $GITHUB_STEP_SUMMARY

